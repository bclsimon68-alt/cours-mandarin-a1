<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cours de Mandarin A1 — Widget interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red-deep:#7A1E1E;
    --red-vivid:#A6302B;
    --gold:#C9A227;
    --gold-light:#E8C766;
    --paper:#FBF4E6;
    --paper-dark:#F1E5C9;
    --ink:#2B2118;
    --ink-soft:#6B5D4C;
    --jade:#2F6B4F;
    --jade-light:#E4F0EA;
    --jade-deep:#1F4D38;
    --danger:#B23A32;
    --danger-light:#F7E3E0;
    --radius:10px;
    --font-display:'Noto Serif TC','Noto Serif',serif;
    --font-body:'Noto Sans','Noto Sans TC',sans-serif;
    --shadow:0 4px 18px rgba(43,33,24,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 100% 0%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(122,30,30,0.07), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:900px;margin:0 auto;padding:0 0 60px;}

  /* ---------- HEADER ---------- */
  .hero{
    background:linear-gradient(135deg,var(--red-deep),var(--red-vivid) 60%,#8C2424);
    color:var(--paper);
    padding:38px 28px 30px;
    position:relative;
    overflow:hidden;
    border-bottom:5px solid var(--gold);
  }
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:relative;z-index:1;}
  .hero-cjk{
    font-family:var(--font-display);
    font-weight:900;
    font-size:15px;
    letter-spacing:6px;
    color:var(--gold-light);
    writing-mode:vertical-rl;
    opacity:0.85;
  }
  .hero h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    margin:2px 0 4px;
    letter-spacing:0.3px;
  }
  .hero p.sub{margin:0;font-size:14px;color:var(--gold-light);font-weight:500;}
  .seal{
    width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #C23B33, #8E1E1E 75%);
    border:2px solid var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);color:var(--gold-light);font-size:22px;font-weight:700;
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    flex-shrink:0;
  }

  /* progress */
  .progress-wrap{margin-top:22px;position:relative;z-index:1;}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gold-light);margin-bottom:6px;font-weight:600;letter-spacing:0.3px;}
  .progress-track{height:9px;border-radius:6px;background:rgba(255,255,255,0.18);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:6px;transition:width .5s ease;}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;gap:6px;
    padding:14px 20px 0;
    overflow-x:auto;
    background:var(--paper-dark);
    border-bottom:2px solid var(--gold);
  }
  .tab{
    font-family:var(--font-body);
    font-weight:700;font-size:13px;
    color:var(--ink-soft);
    background:transparent;
    border:none;border-bottom:3px solid transparent;
    padding:10px 14px 12px;
    cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
    transition:color .2s;
  }
  .tab .tnum{
    font-family:var(--font-display);
    color:var(--gold);font-size:15px;
  }
  .tab.active{color:var(--red-deep);border-bottom-color:var(--red-deep);}
  .tab .mini-seal{
    width:14px;height:14px;border-radius:50%;background:var(--jade);
    display:none;flex-shrink:0;
  }
  .tab.done .mini-seal{display:inline-block;}

  /* ---------- PANELS ---------- */
  .panel{display:none;padding:26px 22px 10px;animation:fadeIn .3s ease;}
  .panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .module-title{
    font-family:var(--font-display);
    font-size:22px;font-weight:700;color:var(--red-deep);
    margin:0 0 2px;
  }
  .module-sub{color:var(--ink-soft);font-style:italic;font-size:13.5px;margin:0 0 20px;}

  /* accordion */
  .acc{border:1px solid var(--gold);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:#fff;}
  .acc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;cursor:pointer;
    background:var(--paper-dark);
    font-weight:700;color:var(--red-deep);font-size:14.5px;
  }
  .acc-head .chev{transition:transform .25s;color:var(--gold);font-size:13px;}
  .acc.open .acc-head .chev{transform:rotate(90deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .acc.open .acc-body{max-height:2400px;}
  .acc-inner{padding:14px 16px 18px;}

  table.voc{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.voc th{
    background:var(--red-deep);color:var(--gold-light);
    text-align:left;padding:8px 10px;font-family:var(--font-body);font-weight:700;
  }
  table.voc td{padding:7px 10px;border-bottom:1px solid var(--paper-dark);vertical-align:top;}
  table.voc tr:nth-child(even) td{background:var(--paper);}
  .pinyin{color:var(--red-deep);font-weight:700;}
  .cjk{font-family:var(--font-display);color:var(--ink-soft);}

  .note{
    border-left:4px solid var(--gold);
    background:var(--paper-dark);
    padding:10px 14px;border-radius:0 8px 8px 0;
    font-size:13px;margin:10px 0;color:var(--ink);
  }
  .note b{color:var(--red-deep);}
  .note.culture{border-left-color:var(--jade);}

  /* ---------- EXERCISES ---------- */
  .exo-section-title{
    font-family:var(--font-display);font-size:17px;color:var(--red-deep);
    margin:26px 0 14px;padding-top:10px;border-top:2px dashed var(--gold);
    display:flex;align-items:center;gap:8px;
  }
  .exo{
    background:#fff;border:1px solid #E6D9B8;border-radius:var(--radius);
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;
  }
  .exo-head{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--red-deep);color:var(--gold-light);
    padding:9px 14px;font-weight:700;font-size:13px;
  }
  .exo-head .exo-seal{
    width:20px;height:20px;border-radius:50%;
    background:var(--jade);display:none;align-items:center;justify-content:center;
    font-size:11px;color:#fff;flex-shrink:0;
  }
  .exo.done .exo-head .exo-seal{display:flex;}
  .exo-body{padding:16px;}
  .exo-prompt{font-size:14px;margin-bottom:12px;}
  .exo-prompt i{color:var(--ink-soft);}

  /* qcm */
  .qcm-item{margin-bottom:14px;}
  .qcm-q{font-size:13.5px;font-weight:600;margin-bottom:7px;}
  .qcm-opts{display:flex;flex-wrap:wrap;gap:8px;}
  .qcm-opt{
    border:1.5px solid var(--gold);background:var(--paper);
    padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer;
    font-family:var(--font-body);color:var(--ink);transition:all .15s;
  }
  .qcm-opt:hover{background:var(--gold-light);}
  .qcm-opt.correct{background:var(--jade-light);border-color:var(--jade);color:var(--jade-deep);font-weight:700;}
  .qcm-opt.wrong{background:var(--danger-light);border-color:var(--danger);color:var(--danger);}
  .qcm-opt.disabled{pointer-events:none;opacity:0.85;}
  .qcm-opt.correct::before{content:"\2713  ";}
  .qcm-opt.wrong::before{content:"\2717  ";}
  .qcm-feedback{
    display:none;margin-top:8px;padding:7px 12px;border-radius:7px;
    font-size:13px;font-weight:700;align-items:center;gap:6px;
  }
  .qcm-feedback.show{display:flex;}
  .qcm-feedback.good{background:var(--jade-light);color:var(--jade-deep);border:1.5px solid var(--jade);}
  .qcm-feedback.bad{background:var(--danger-light);color:var(--danger);border:1.5px solid var(--danger);}

  /* text/reveal */
  .field-row{margin-bottom:10px;}
  .field-row label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink);}
  .field-row input[type=text], .field-row textarea{
    width:100%;border:1.5px solid #DDD0AE;border-radius:7px;
    padding:8px 10px;font-family:var(--font-body);font-size:13.5px;
    background:var(--paper);color:var(--ink);
  }
  .field-row textarea{min-height:70px;resize:vertical;}
  .field-row input:focus, .field-row textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}

  .btn{
    font-family:var(--font-body);font-weight:700;font-size:12.5px;
    border:none;border-radius:20px;padding:8px 16px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:transform .15s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-reveal{background:var(--red-deep);color:#fff;}
  .btn-reveal:hover{background:var(--red-vivid);}
  .btn-outline{background:transparent;border:1.5px solid var(--jade);color:var(--jade-deep);}
  .btn-outline.active{background:var(--jade);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid #DDD0AE;}

  .reveal-box{
    display:none;margin-top:10px;background:var(--jade-light);
    border-left:4px solid var(--jade);border-radius:0 8px 8px 0;
    padding:10px 14px;font-size:13px;
  }
  .reveal-box.show{display:block;}
  .reveal-box b{color:var(--jade-deep);}
  .reveal-box .expl{color:var(--ink-soft);font-style:italic;margin-top:5px;display:block;}

  .self-check{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}

  /* matching */
  .match-wrap{display:flex;gap:22px;flex-wrap:wrap;}
  .match-col{flex:1;min-width:140px;display:flex;flex-direction:column;gap:8px;}
  .match-pill{
    border:1.5px solid var(--gold);border-radius:8px;padding:8px 10px;
    font-size:13px;cursor:pointer;background:var(--paper);transition:all .15s;
  }
  .match-pill.selected{background:var(--gold-light);border-color:var(--red-deep);}
  .match-pill.matched{background:var(--jade-light);border-color:var(--jade);color:var(--jade-deep);font-weight:700;pointer-events:none;}
  .match-pill.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  /* footer / reset */
  .footer-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px 30px;border-top:1px solid #E6D9B8;margin-top:10px;
    flex-wrap:wrap;gap:10px;
  }
  .footer-bar .stat{font-size:13px;color:var(--ink-soft);}
  .footer-bar .stat b{color:var(--red-deep);}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(43,33,24,0.55);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:360px;box-shadow:var(--shadow);text-align:center;}
  .modal h3{margin:0 0 10px;color:var(--red-deep);font-family:var(--font-display);}
  .modal p{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .modal .modal-btns{display:flex;gap:10px;justify-content:center;}

  .final-recap{background:#fff;border:1px solid var(--gold);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}

  /* ---------- AUDIO ---------- */
  .spk-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    background:var(--gold-light);border:1px solid var(--gold);
    color:var(--red-deep);font-size:11px;cursor:pointer;
    margin-left:6px;vertical-align:middle;flex-shrink:0;
    transition:transform .15s, background .15s;
  }
  .spk-btn:hover{background:var(--gold);transform:scale(1.1);}
  .spk-btn.playing{background:var(--jade);color:#fff;border-color:var(--jade-deep);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .studio{background:#fff;border:1px solid var(--gold);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .studio label{display:block;font-size:13px;font-weight:700;color:var(--red-deep);margin-bottom:6px;}
  .studio textarea{width:100%;min-height:70px;border:1.5px solid #DDD0AE;border-radius:7px;padding:10px;font-size:15px;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
  .studio-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;}
  .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);display:none;}
  .rec-dot.on{display:inline-block;animation:pulse 0.9s infinite;}
  .btn-record{background:var(--danger);color:#fff;}
  .btn-record.recording{background:var(--red-deep);}
  audio{margin-top:10px;width:100%;display:none;}
  audio.show{display:block;}
  .studio-note{font-size:12px;color:var(--ink-soft);margin-top:14px;border-top:1px dashed var(--gold);padding-top:10px;}
  .studio-status{font-size:12.5px;color:var(--ink-soft);}
  .studio-status.error{color:var(--danger);}

  @media (max-width:600px){
    .hero h1{font-size:22px;}
    .match-wrap{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-cjk">課程互動</div>
      </div>
      <div>
        <h1>Cours de Mandarin A1</h1>
        <p class="sub">Widget interactif — pīnyīn · 漢字 · français</p>
      </div>
      <div class="seal" id="heroSeal">印</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Progression globale</span><span id="progressText">0 / 27</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <div class="footer-bar">
    <div class="stat">Progression enregistrée automatiquement — <b id="footerCount">0</b> / 27 exercices validés</div>
    <button class="btn btn-ghost" id="resetBtn">&#8635; Réinitialiser ma progression</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Réinitialiser ?</h3>
    <p>Toute votre progression sur les 27 exercices sera définitivement effacée. Cette action est irréversible.</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="cancelReset">Annuler</button>
      <button class="btn btn-reveal" id="confirmReset">Oui, réinitialiser</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DONNÉES — Cours de Mandarin A1
   ============================================================ */
const MODULES = [
  {
    id:'m1', num:'一', title:'Savoir compter', sub:'Shùzì — 數字 : les chiffres et les nombres',
    vocab:[
      {title:'1.1 — Les chiffres de 0 à 10', rows:[
        ['0','líng','零'],['1','yī','一'],['2','èr','二'],['3','sān','三'],['4','sì','四'],
        ['5','wǔ','五'],['6','liù','六'],['7','qī','七'],['8','bā','八'],['9','jiǔ','九'],['10','shí','十']
      ], cols:['Chiffre','Pīnyīn','Caractère']},
      {title:'1.2 — Dizaines, centaines, milliers', rows:[
        ['11','shí yī','十一'],['20','èr shí','二十'],['99','jiǔ shí jiǔ','九十九'],
        ['100','yī bǎi','一百'],['200','liǎng bǎi','兩百'],['1 000','yī qiān','一千'],['10 000','yī wàn','一萬']
      ], cols:['Nombre','Pīnyīn','Caractère']},
      {title:'1.3 — Les jours de la semaine', rows:[
        ['Lundi','xīngqī yī','星期一'],['Mardi','xīngqī èr','星期二'],['Mercredi','xīngqī sān','星期三'],
        ['Jeudi','xīngqī sì','星期四'],['Vendredi','xīngqī wǔ','星期五'],['Samedi','xīngqī liù','星期六'],
        ['Dimanche','xīngqī tiān','星期天']
      ], cols:['Français','Pīnyīn','Caractère']},
      {title:'1.4 — Dire l\'heure', rows:[
        ['3h00','sān diǎn','三點'],['3h15','sān diǎn shí wǔ fēn','三點十五分'],
        ['7h30','qī diǎn bàn','七點半'],['12h00','shí èr diǎn','十二點']
      ], cols:['Heure','Pīnyīn','Caractère']}
    ],
    notes:[
      {type:'warn', title:'&#9888; Pièges francophones', html:'11 = <b>shí yī</b> (dix-un) : pas de mot spécial. wàn (萬) = 10 000, une unité sans équivalent français. Devant une unité, 2 se dit <b>liǎng</b> (兩) et non èr : liǎng bǎi, liǎng diǎn.'}
    ],
    exos:[
      {id:1,type:'qcm',title:'QCM — chiffres', prompt:'Choisissez le bon pīnyīn pour chaque chiffre.',
        items:[
          {q:'6 = ?', opts:['liù','jiǔ','qī','sì'], correct:0},
          {q:'9 = ?', opts:['bā','jiǔ','liù','wǔ'], correct:1},
          {q:'4 = ?', opts:['sì','shí','sān','wǔ'], correct:0},
          {q:'8 = ?', opts:['bā','qī','jiǔ','liù'], correct:0},
          {q:'10 = ?', opts:['shí','sì','shí yī','qī'], correct:0},
        ]},
      {id:2,type:'text',title:'Écrire en pīnyīn', prompt:'Écrivez en pīnyīn les nombres suivants.',
        items:[
          {label:'15',answer:'shí wǔ (十五)'},{label:'23',answer:'èr shí sān (二十三)'},
          {label:'47',answer:'sì shí qī (四十七)'},{label:'68',answer:'liù shí bā (六十八)'},
          {label:'99',answer:'jiǔ shí jiǔ (九十九)'}
        ]},
      {id:3,type:'match',title:'Appariement — jours de la semaine',
        prompt:'Reliez chaque jour en pīnyīn à sa traduction française.',
        pairs:[['xīngqī yī','Lundi'],['xīngqī èr','Mardi'],['xīngqī sān','Mercredi'],['xīngqī sì','Jeudi'],['xīngqī wǔ','Vendredi']]},
      {id:4,type:'text',title:'Compléter — les heures', prompt:'Écrivez en pīnyīn les heures suivantes.',
        items:[
          {label:'3h15',answer:'sān diǎn shí wǔ fēn (三點十五分)'},
          {label:'7h30',answer:'qī diǎn bàn (七點半)'},
          {label:'12h00',answer:'shí èr diǎn (十二點)'}
        ]},
      {id:5,type:'free',title:'Production libre', prompt:'Écrivez en pīnyīn votre date de naissance (jour/mois) et un numéro de téléphone fictif à 4 chiffres, chiffre par chiffre.',
        example:'Exemple : Wǒ de shēngrì shì shí èr yuè sān rì. Numéro : líng liù, yī èr, sān sì, wǔ liù.'}
    ]
  },
  {
    id:'m2', num:'二', title:'Les verbes du quotidien', sub:'Rìcháng dòngcí — 日常動詞 : actions essentielles',
    vocab:[
      {title:'2.1 — Les 10 verbes essentiels', rows:[
        ['shì','是','être','Wǒ shì lǎoshī. (我是老師。) — Je suis professeur.'],
        ['yǒu','有','avoir','Wǒ yǒu yī zhī māo. (我有一隻貓。) — J\'ai un chat.'],
        ['chī','吃','manger','Tā chī fàn. (他吃飯。) — Il mange du riz.'],
        ['hē','喝','boire','Wǒ hē chá. (我喝茶。) — Je bois du thé.'],
        ['kàn','看','voir / regarder','Wǒmen kàn diànyǐng. (我們看電影。) — Nous regardons un film.'],
        ['xiǎng','想','vouloir / penser','Wǒ xiǎng chī. (我想吃。) — Je veux manger.'],
        ['zuò','做','faire','Nǐ zuò shénme? (你做什麼？) — Que fais-tu ?'],

<script>
/* ============================================================
   ÉTAT & PERSISTANCE (window.storage)
   ============================================================ */
let progress = {}; // { exId: true/false }

async function loadProgress(){
  try{
    const res = await window.storage.get('mandarin_a1_progress', false);
    if(res && res.value){ progress = JSON.parse(res.value); }
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  try{ await window.storage.set('mandarin_a1_progress', JSON.stringify(progress), false); }
  catch(e){ /* silent */ }
}
function markDone(exId, done){
  progress[exId] = !!done;
  saveProgress();
  updateProgressUI();
}

/* ============================================================
   AUDIO — synthèse vocale (écoute) & enregistrement (studio)
   ============================================================ */
let speakRegistry = {};
let speakCounter = 0;
let zhVoice = null;

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  zhVoice = voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang==='zh-CN')
         || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function withSpeakBtn(text){
  const matches = String(text).match(/[\u4e00-\u9fff]+/g);
  if(!matches) return text;
  const hanzi = matches.join('，');
  const key = 'spk'+(speakCounter++);
  speakRegistry[key] = hanzi;
  return `${text}<button class="spk-btn" data-spk="${key}" title="Écouter la prononciation">&#128266;</button>`;
}

function speakZH(text, btnEl){
  if(!('speechSynthesis' in window)){
    alert('La synthèse vocale n\'est pas disponible sur ce navigateur.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = zhVoice ? zhVoice.lang : 'zh-CN';
  if(zhVoice) utter.voice = zhVoice;
  utter.rate = 0.82;
  utter.pitch = 1;
  if(btnEl){
    utter.onstart = ()=> btnEl.classList.add('playing');
    utter.onend = ()=> btnEl.classList.remove('playing');
    utter.onerror = ()=> btnEl.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

function attachSpeakButtons(root){
  root.querySelectorAll('[data-spk]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      const text = speakRegistry[btn.dataset.spk];
      if(text) speakZH(text, btn);
    });
  });
}

/* ---- Studio d'enregistrement ---- */
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

function attachStudioEvents(){
  const listenBtn = document.getElementById('studioListen');
  const recordBtn = document.getElementById('studioRecord');
  const statusEl = document.getElementById('studioStatus');
  const dot = document.getElementById('recDot');
  const player = document.getElementById('myRecordingPlayer');
  if(!listenBtn) return; // studio panel not currently rendered

  listenBtn.addEventListener('click', ()=>{
    const text = document.getElementById('studioText').value.trim();
    const hanzi = (text.match(/[\u4e00-\u9fff]+/g)||[]).join('，') || text;
    if(!hanzi){ statusEl.textContent = 'Ajoutez du texte à écouter.'; statusEl.className='studio-status error'; return; }
    statusEl.textContent = ''; statusEl.className='studio-status';
    speakZH(hanzi, listenBtn);
  });

  recordBtn.addEventListener('click', async ()=>{
    if(isRecording){
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.textContent = '&#127908; M\'enregistrer';
      recordBtn.innerHTML = '&#127908; M\'enregistrer';
      recordBtn.classList.remove('recording');
      dot.classList.remove('on');
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent = 'Micro non disponible dans cet environnement. Ouvrez le fichier dans un onglet de navigateur.';
      statusEl.className = 'studio-status error';
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = ()=>{
        const blob = new Blob(recordedChunks, {type:'audio/webm'});
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.classList.add('show');
        stream.getTracks().forEach(t=>t.stop());
        statusEl.textContent = 'Enregistrement prêt — écoutez-vous ci-dessous.';
        statusEl.className = 'studio-status';
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.innerHTML = '&#9632; Arrêter';
      recordBtn.classList.add('recording');
      dot.classList.add('on');
      statusEl.textContent = 'Enregistrement en cours…';
      statusEl.className = 'studio-status';
    }catch(err){
      statusEl.textContent = 'Accès micro refusé ou bloqué dans cet environnement.';
      statusEl.className = 'studio-status error';
    }
  });
}

/* ============================================================

   ============================================================ */
let activeTab = 'm1';

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = MODULES.map(m=>{
    const done = m.exos.every(e=>progress[e.id]);
    return `<button class="tab ${m.id===activeTab?'active':''} ${done?'done':''}" data-tab="${m.id}">
      <span class="tnum">${m.num}</span> ${m.title} <span class="mini-seal" title="Module terminé"></span>
    </button>`;
  }).join('')
    + `<button class="tab ${activeTab==='studio'?'active':''}" data-tab="studio"><span class="tnum">&#127908;</span> S'entraîner</button>`
    + `<button class="tab ${activeTab==='recap'?'active':''}" data-tab="recap"><span class="tnum">結</span> Récap</button>`;
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; renderAll(); });
  });
}

function vocabTable(section){
  const head = section.cols.map(c=>`<th>${c}</th>`).join('');
  const body = section.rows.map(r=>{
    const tds = r.map((cell,i)=>{
      const colName = (section.cols[i]||'');
      const hasCJK = /[\u4e00-\u9fff]/.test(cell);
      const cls = hasCJK ? 'cjk' : (colName.indexOf('Pīnyīn')!==-1 ? 'pinyin' : '');
      return `<td class="${cls}">${withSpeakBtn(String(cell))}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="voc"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function renderModulePanel(m){
  const vocabHtml = m.vocab.map((sec,i)=>`
    <div class="acc ${i===0?'open':''}" data-acc>
      <div class="acc-head"><span>${sec.title}</span><span class="chev">&#9656;</span></div>
      <div class="acc-body"><div class="acc-inner">${vocabTable(sec)}</div></div>
    </div>`).join('');

  const notesHtml = (m.notes||[]).map(n=>`<div class="note ${n.type==='culture'?'culture':''}"><b>${n.title}</b><br>${n.html}</div>`).join('');

  const exosHtml = m.exos.map(ex=>renderExercise(ex)).join('');

  return `
    <div class="module-title">${m.num} — ${m.title}</div>
    <p class="module-sub">${m.sub}</p>
    ${vocabHtml}
    ${notesHtml}
    <div class="exo-section-title">&#9999; Exercices — ${m.title}</div>
    ${exosHtml}
  `;
}

function renderExercise(ex){
  const done = !!progress[ex.id];
  let body = '';
  if(ex.type === 'qcm'){
    body = ex.items.map((it,idx)=>`
      <div class="qcm-item">
        <div class="qcm-q">${it.q}</div>
        <div class="qcm-opts" data-qcm="${ex.id}-${idx}" data-correct="${it.correct}">
          ${it.opts.map((o,oi)=>`<button class="qcm-opt" data-idx="${oi}">${o}</button>`).join('')}
        </div>
        <div class="qcm-feedback" data-feedback="${ex.id}-${idx}"></div>
      </div>`).join('');
  } else if(ex.type === 'text'){
    body = ex.items.map((it,idx)=>`
      <div class="field-row">
        <label>${it.label}</label>
        <input type="text" placeholder="Votre réponse (facultatif)…" data-textinput="${ex.id}-${idx}">
      </div>
      <div class="reveal-box" data-reveal="${ex.id}-${idx}"><b>&#9989; ${withSpeakBtn(it.answer)}</b></div>`).join('') +
      `<button class="btn btn-reveal" data-revealbtn="${ex.id}">Voir la correction</button>
       <label class="self-check"><input type="checkbox" data-selfcheck="${ex.id}" ${done?'checked':''}> J'ai vérifié mes réponses</label>`;
  } else if(ex.type === 'match'){
    body = renderMatch(ex);
  } else if(ex.type === 'free'){
    body = `
      <div class="field-row"><textarea placeholder="Écrivez votre réponse ici…" data-freeinput="${ex.id}"></textarea></div>
      <button class="btn btn-reveal" data-revealbtn="${ex.id}">Voir un exemple</button>
      <div class="reveal-box" data-reveal="${ex.id}-0"><b>&#128161; ${withSpeakBtn(ex.example)}</b></div>
      <label class="self-check"><input type="checkbox" data-selfcheck="${ex.id}" ${done?'checked':''}> J'ai terminé cet exercice</label>`;
  }

  return `
    <div class="exo ${done?'done':''}" id="exo-${ex.id}">
      <div class="exo-head"><span>Question ${ex.id} — ${ex.title}</span><span class="exo-seal">&#10003;</span></div>
      <div class="exo-body">
        <div class="exo-prompt">${ex.prompt}${ex.single?'':''}</div>
        ${body}
      </div>
    </div>`;
}

function renderMatch(ex){
  const leftItems = ex.pairs.map((p,i)=>({key:i, text:p[0]}));
  const rightItems = ex.pairs.map((p,i)=>({key:i, text:p[1]}));
  // shuffle right column deterministically per session
  const shuffled = [...rightItems].sort(()=>Math.random()-0.5);
  const leftHtml = leftItems.map(li=>`<div class="match-pill" data-match-left="${ex.id}" data-key="${li.key}">${li.text}</div>`).join('');
  const rightHtml = shuffled.map(ri=>`<div class="match-pill" data-match-right="${ex.id}" data-key="${ri.key}">${ri.text}</div>`).join('');
  return `<div class="match-wrap" data-matchwrap="${ex.id}">
      <div class="match-col">${leftHtml}</div>
      <div class="match-col">${rightHtml}</div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--ink-soft);">Cliquez un élément à gauche, puis son équivalent à droite.</div>`;
}

function renderRecap(){
  return `
    <div class="module-title">結 — Récapitulatif final</div>
    <p class="module-sub">Ce que vous avez appris dans les 5 modules</p>
    <div class="final-recap">
      <table class="voc">
        <thead><tr><th>Module</th><th>Compétence acquise</th><th>Point clé</th></tr></thead>
        <tbody>
          <tr><td>1 — Chiffres</td><td>Compter, dire l'heure et les jours</td><td>Logique multiplicative : èr shí = 20</td></tr>
          <tr><td>2 — Verbes</td><td>10 verbes essentiels</td><td>Pas de conjugaison ! bù = négation générale</td></tr>
          <tr><td>3 — Pronoms</td><td>Personnels et possessifs</td><td>Pluriel en -men / possessif avec de</td></tr>
          <tr><td>4 — Phrase</td><td>Construire une phrase, exprimer le temps</td><td>SVComp + marqueurs (le/guo/yào)</td></tr>
          <tr><td>5 — Politesse</td><td>S'exprimer poliment</td><td>Nǐ hǎo / Xièxie / Duìbuqǐ / Zàijiàn</td></tr>
        </tbody>
      </table>
      <div class="note culture" style="margin-top:16px;">&#127775; <b>Prochaine étape — A2 :</b> classifieurs nominaux, compléments de résultat, vocabulaire thématique (famille, nourriture, transports, météo…).</div>
    </div>`;
}

function renderStudio(){
  return `
    <div class="module-title">&#127908; S'entraîner à la prononciation</div>
    <p class="module-sub">Écoutez le modèle, puis enregistrez-vous pour comparer à l'oreille</p>
    <div class="studio">
      <label>Phrase à travailler (collez du pīnyīn/caractères depuis un module, ou tapez le vôtre)</label>
      <textarea id="studioText" placeholder="Ex : Nǐ hǎo! 你好！">你好！</textarea>
      <div class="studio-row">
        <button class="btn btn-reveal" id="studioListen">&#128266; Écouter le modèle</button>
        <button class="btn btn-record" id="studioRecord">&#127908; M'enregistrer</button>
        <span class="rec-dot" id="recDot"></span>
        <span class="studio-status" id="studioStatus"></span>
      </div>
      <audio id="myRecordingPlayer" controls></audio>
      <div class="studio-note">
        &#8505; L'écoute du modèle utilise la synthèse vocale de votre navigateur (fonctionne partout).
        L'enregistrement nécessite l'accès au micro : s'il ne démarre pas ici, ouvrez ce fichier HTML
        directement dans un onglet de navigateur (hors aperçu intégré) et autorisez le micro.
        Il n'y a pas de correction automatique des tons — comparez votre enregistrement au modèle à l'oreille.
      </div>
    </div>`;
}

function renderPanels(){
  const panelsEl = document.getElementById('panels');
  speakRegistry = {}; speakCounter = 0;
  panelsEl.innerHTML = MODULES.map(m=>`<div class="panel ${m.id===activeTab?'active':''}" id="panel-${m.id}">${renderModulePanel(m)}</div>`).join('')
    + `<div class="panel ${activeTab==='studio'?'active':''}" id="panel-studio">${renderStudio()}</div>`
    + `<div class="panel ${activeTab==='recap'?'active':''}" id="panel-recap">${renderRecap()}</div>`;
  attachPanelEvents();
  attachStudioEvents();
}

function attachPanelEvents(){
  attachSpeakButtons(document.getElementById('panels'));
  // accordions
  document.querySelectorAll('[data-acc]').forEach(acc=>{
    acc.querySelector('.acc-head').addEventListener('click', ()=> acc.classList.toggle('open'));
  });
  // qcm
  document.querySelectorAll('[data-qcm]').forEach(group=>{
    const [exId, idx] = group.dataset.qcm.split('-');
    const correct = parseInt(group.dataset.correct,10);
    const feedback = document.querySelector(`[data-feedback="${exId}-${idx}"]`);
    group.querySelectorAll('.qcm-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const chosen = parseInt(btn.dataset.idx,10);
        const correctOptText = group.querySelectorAll('.qcm-opt')[correct].textContent.trim();
        group.querySelectorAll('.qcm-opt').forEach(b=>b.classList.add('disabled'));
        if(chosen === correct){
          btn.classList.add('correct');
          if(feedback){
            feedback.textContent = '✅ Bonne réponse !';
            feedback.className = 'qcm-feedback show good';
          }
        } else{
          btn.classList.add('wrong');
          group.querySelectorAll('.qcm-opt')[correct].classList.add('correct');
          if(feedback){
            feedback.textContent = `❌ Ce n'est pas ça. La bonne réponse était : ${correctOptText}`;
            feedback.className = 'qcm-feedback show bad';
          }
        }
        checkQcmComplete(parseInt(exId,10));
      });
    });
  });
  // text reveal buttons
  document.querySelectorAll('[data-revealbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId = btn.dataset.revealbtn;
      document.querySelectorAll(`[data-reveal^="${exId}-"]`).forEach(box=>box.classList.add('show'));
      btn.textContent = 'Correction affichée &#10003;'.replace('&#10003;','✓');
      btn.disabled = true;
      btn.style.opacity = '0.7';
    });
  });
  // self-check
  document.querySelectorAll('[data-selfcheck]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const exId = parseInt(cb.dataset.selfcheck,10);
      markDone(exId, cb.checked);
      const exoEl = document.getElementById('exo-'+exId);
      if(exoEl) exoEl.classList.toggle('done', cb.checked);
      renderTabs();
    });
  });
  // matching
  document.querySelectorAll('[data-matchwrap]').forEach(wrap=>{
    const exId = parseInt(wrap.dataset.matchwrap,10);
    let selectedLeft = null;
    let matchedCount = 0;
    const totalPairs = wrap.querySelectorAll('[data-match-left]').length;
    wrap.querySelectorAll('[data-match-left]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(el.classList.contains('matched')) return;
        wrap.querySelectorAll('[data-match-left]').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
        selectedLeft = el;
      });
    });
    wrap.querySelectorAll('[data-match-right]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(el.classList.contains('matched') || !selectedLeft) return;
        if(el.dataset.key === selectedLeft.dataset.key){
          el.classList.add('matched'); selectedLeft.classList.add('matched');
          selectedLeft.classList.remove('selected');
          matchedCount++;
          selectedLeft = null;
          if(matchedCount === totalPairs){
            markDone(exId, true);
            const exoEl = document.getElementById('exo-'+exId);
            if(exoEl) exoEl.classList.add('done');
            renderTabs();
          }
        } else {
          el.classList.add('shake');
          selectedLeft.classList.add('shake');
          setTimeout(()=>{ el.classList.remove('shake'); if(selectedLeft) selectedLeft.classList.remove('shake'); },300);
        }
      });
    });
  });
}

function checkQcmComplete(exId){
  const ex = MODULES.flatMap(m=>m.exos).find(e=>e.id===exId);
  const groups = document.querySelectorAll(`[data-qcm^="${exId}-"]`);
  let answered = 0;
  groups.forEach(g=>{ if(g.querySelector('.correct') || g.querySelector('.wrong')) answered++; });
  if(answered === ex.items.length){
    markDone(exId, true);
    const exoEl = document.getElementById('exo-'+exId);
    if(exoEl) exoEl.classList.add('done');
    renderTabs();
  }
}

function updateProgressUI(){
  const count = Object.values(progress).filter(Boolean).length;
  document.getElementById('progressText').textContent = `${count} / ${TOTAL_EXOS}`;
  document.getElementById('footerCount').textContent = count;
  document.getElementById('progressFill').style.width = (count/TOTAL_EXOS*100)+'%';
  document.getElementById('heroSeal').style.opacity = count===TOTAL_EXOS ? '1' : '0.9';
}

function renderAll(){
  renderTabs();
  renderPanels();
  updateProgressUI();
}

/* ============================================================
   RESET
   ============================================================ */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.add('show');
});
document.getElementById('cancelReset').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('confirmReset').addEventListener('click', async ()=>{
  progress = {};
  await saveProgress();
  document.getElementById('modalOverlay').classList.remove('show');
  renderAll();
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadProgress();
  renderAll();
})();
</script>
